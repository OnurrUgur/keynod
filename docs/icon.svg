<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile-clip">
      <path d="M 285 100 L 739 100 C 841 100 924 183 924 285 L 924 739 C 924 841 841 924 739 924 L 285 924 C 183 924 100 841 100 739 L 100 285 C 100 183 183 100 285 100 Z"/>
    </clipPath>

    <clipPath id="torso-clip">
      <path d="M 436 520 L 580 520 L 647 772 C 654 800 636 816 604 816 Q 508 824 412 816 C 380 816 362 800 369 772 Z"/>
    </clipPath>

    <clipPath id="head-clip">
      <circle cx="516" cy="412" r="160"/>
    </clipPath>

    <clipPath id="visor-clip">
      <rect x="412" y="380" width="228" height="132" rx="64" ry="64"/>
    </clipPath>

    <linearGradient id="tile-bg" x1="120" y1="100" x2="900" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE55C"/>
      <stop offset="52%" stop-color="#FFB336"/>
      <stop offset="100%" stop-color="#FF7238"/>
    </linearGradient>

    <radialGradient id="sun-glow" cx="512" cy="438" r="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9C8" stop-opacity="0.56"/>
      <stop offset="58%" stop-color="#FFE55C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFE55C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tile-rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.48"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="72%" stop-color="#9A2D08" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#9A2D08" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="plum-torso" x1="380" y1="530" x2="640" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#582A94"/>
      <stop offset="55%" stop-color="#3E1B73"/>
      <stop offset="100%" stop-color="#280F52"/>
    </linearGradient>

    <linearGradient id="bounce-light" x1="508" y1="824" x2="508" y2="764" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9A3C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FF9A3C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="collar-mint" x1="420" y1="560" x2="600" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CFAB4"/>
      <stop offset="100%" stop-color="#19CF87"/>
    </linearGradient>

    <linearGradient id="clasp-gold" x1="504" y1="590" x2="526" y2="624" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE86B"/>
      <stop offset="100%" stop-color="#FF9B24"/>
    </linearGradient>

    <radialGradient id="plum-head" cx="454" cy="330" r="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6F3FB8"/>
      <stop offset="54%" stop-color="#45207D"/>
      <stop offset="100%" stop-color="#291054"/>
    </radialGradient>

    <linearGradient id="visor-bg" x1="526" y1="380" x2="526" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#230F4A"/>
      <stop offset="100%" stop-color="#14062D"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile-clip)">
    <!-- Base tile -->
    <path id="tile" d="M 285 100 L 739 100 C 841 100 924 183 924 285 L 924 739 C 924 841 841 924 739 924 L 285 924 C 183 924 100 841 100 739 L 100 285 C 100 183 183 100 285 100 Z" fill="url(#tile-bg)"/>
    <circle cx="512" cy="438" r="415" fill="url(#sun-glow)"/>

    <!-- Ground shadow -->
    <ellipse cx="508" cy="824" rx="166" ry="26" fill="#C24210" opacity="0.24"/>
    <ellipse cx="508" cy="820" rx="118" ry="14" fill="#992D08" opacity="0.18"/>

    <!-- Kinetic nod motion arcs -->
    <path d="M 346 320 A 196 196 0 0 1 489 224" fill="none" stroke="#CC5514" stroke-width="20" stroke-linecap="round" opacity="0.16"/>
    <path d="M 346 314 A 196 196 0 0 1 489 218" fill="none" stroke="#FFFDF5" stroke-width="20" stroke-linecap="round"/>
    <path d="M 344 257 A 232 232 0 0 1 452 189" fill="none" stroke="#FFFDF5" stroke-width="14" stroke-linecap="round" opacity="0.82"/>
    <path d="M 706 465 A 196 196 0 0 1 657 554" fill="none" stroke="#CC5514" stroke-width="18" stroke-linecap="round" opacity="0.16"/>
    <path d="M 706 459 A 196 196 0 0 1 657 548" fill="none" stroke="#FFFDF5" stroke-width="18" stroke-linecap="round" opacity="0.94"/>

    <!-- Keyhole guardian torso (lower trapezoid) -->
    <g clip-path="url(#torso-clip)">
      <path d="M 436 520 L 580 520 L 647 772 C 654 800 636 816 604 816 Q 508 824 412 816 C 380 816 362 800 369 772 Z" fill="url(#plum-torso)"/>
      <path d="M 434 520 L 478 520 L 434 824 L 352 824 Z" fill="#7C4BC4" opacity="0.28"/>
      <rect x="350" y="764" width="316" height="62" fill="url(#bounce-light)"/>

      <!-- Collar shadow & Spring-Mint collar -->
      <path d="M 416 588 Q 515 628 604 592 L 608 610 Q 515 646 412 606 Z" fill="#160630" opacity="0.32"/>
      <path d="M 422 544 Q 515 588 598 548 L 606 586 Q 515 626 414 584 Z" fill="url(#collar-mint)"/>
      <path d="M 420 572 Q 515 612 602 576" fill="none" stroke="#B4FFE0" stroke-width="6" stroke-linecap="round" opacity="0.45"/>

      <!-- Chin shadow cast onto neck -->
      <ellipse cx="516" cy="560" rx="108" ry="34" fill="#160630" opacity="0.42"/>
    </g>

    <!-- Golden collar clasp -->
    <circle cx="515" cy="609" r="20" fill="#230C47" opacity="0.36"/>
    <circle cx="515" cy="605" r="16" fill="url(#clasp-gold)"/>
    <circle cx="510" cy="600" r="5" fill="#FFF8CC" opacity="0.72"/>

    <!-- Keyhole guardian head (round nodding top) -->
    <g clip-path="url(#head-clip)">
      <circle cx="516" cy="412" r="160" fill="url(#plum-head)"/>
      <path d="M 388 366 A 136 136 0 0 1 510 276" fill="none" stroke="#B182F5" stroke-width="14" stroke-linecap="round" opacity="0.34"/>
      <path d="M 440 544 A 144 144 0 0 0 584 546" fill="none" stroke="#48F7B0" stroke-width="8" stroke-linecap="round" opacity="0.22"/>
    </g>

    <!-- Tilted nodding visor & joyful face -->
    <g transform="rotate(7 526 446)">
      <rect x="408" y="376" width="236" height="140" rx="68" ry="68" fill="#1F0B40" opacity="0.68"/>
      <rect x="412" y="380" width="228" height="132" rx="64" ry="64" fill="url(#visor-bg)"/>

      <g clip-path="url(#visor-clip)">
        <ellipse cx="476" cy="390" rx="74" ry="26" fill="#FFFFFF" opacity="0.09"/>
      </g>

      <!-- Rosy cheeks -->
      <ellipse cx="458" cy="472" rx="16" ry="9" fill="#FF6B8B" opacity="0.9"/>
      <ellipse cx="594" cy="472" rx="15" ry="9" fill="#FF6B8B" opacity="0.9"/>

      <!-- Happy nodding eyes (glow + crisp arcs) -->
      <path d="M 454 452 Q 479 406 504 452" fill="none" stroke="#2BE89A" stroke-width="30" stroke-linecap="round" opacity="0.22"/>
      <path d="M 550 452 Q 574 406 598 452" fill="none" stroke="#2BE89A" stroke-width="30" stroke-linecap="round" opacity="0.22"/>
      <path d="M 454 452 Q 479 406 504 452" fill="none" stroke="#4DFAB2" stroke-width="20" stroke-linecap="round"/>
      <path d="M 550 452 Q 574 406 598 452" fill="none" stroke="#4DFAB2" stroke-width="20" stroke-linecap="round"/>

      <!-- Approving smile -->
      <path d="M 511 472 Q 526 488 541 472" fill="none" stroke="#2BE89A" stroke-width="18" stroke-linecap="round" opacity="0.2"/>
      <path d="M 511 472 Q 526 488 541 472" fill="none" stroke="#4DFAB2" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- Subtle inner tile rim highlight -->
    <path d="M 285 100 L 739 100 C 841 100 924 183 924 285 L 924 739 C 924 841 841 924 739 924 L 285 924 C 183 924 100 841 100 739 L 100 285 C 100 183 183 100 285 100 Z" fill="none" stroke="url(#tile-rim)" stroke-width="10"/>
  </g>
</svg>